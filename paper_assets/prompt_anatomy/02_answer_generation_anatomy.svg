<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840">
  <defs>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#5f6f89}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:8}.official{fill:#edf5ff;stroke:#6aa3dc}.addon{fill:#eef9f1;stroke:#6fb879}.input{fill:#fff7e6;stroke:#d6a03c}.rule{fill:#f8f0ff;stroke:#a37bd1}.out{fill:#f3f4f6;stroke:#94a3b8}
      .head{font-size:18px;font-weight:700}.body{font-size:15px;fill:#334155}.small{font-size:13px;fill:#64748b}.mono{font-family:Consolas,"Courier New",monospace;font-size:15px;fill:#0f172a}
      .arrow{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1280" height="840" fill="#f8fafc"/>
  <text x="60" y="64" class="title">LightRAG 回答生成 Prompt 拆解</text>
  <text x="60" y="94" class="sub">对应 rag_response / naive_rag_response；本系统在官方模板末尾追加课程助教回答指导语，并在支持时传入 user_prompt。</text>

  <rect x="60" y="145" width="300" height="155" class="box official"/>
  <text x="85" y="184" class="head">角色约束</text>
  <text x="85" y="220" class="body">知识库问答助手</text>
  <text x="85" y="248" class="body">只能依据 Context 回答</text>
  <text x="85" y="276" class="body">外部知识仅用于组织语言</text>

  <rect x="390" y="145" width="300" height="155" class="box official"/>
  <text x="415" y="184" class="head">任务目标</text>
  <text x="415" y="220" class="body">生成结构化回答</text>
  <text x="415" y="248" class="body">整合图谱数据与文档块</text>
  <text x="415" y="276" class="body">结合历史对话理解意图</text>

  <rect x="720" y="145" width="300" height="155" class="box input"/>
  <text x="745" y="184" class="head">输入变量</text>
  <text x="745" y="220" class="body">用户问题、历史对话</text>
  <text x="745" y="248" class="body">Knowledge Graph Data</text>
  <text x="745" y="276" class="body">Document Chunks</text>

  <rect x="270" y="380" width="340" height="190" class="box rule"/>
  <text x="295" y="420" class="head">回答规则</text>
  <text x="295" y="456" class="body">逐步判断问题意图</text>
  <text x="295" y="484" class="body">只抽取与问题直接相关的证据</text>
  <text x="295" y="512" class="body">记录支撑事实的 reference_id</text>
  <text x="295" y="540" class="body">证据不足时说明信息不足</text>

  <rect x="670" y="380" width="340" height="190" class="box out"/>
  <text x="695" y="420" class="head">输出限制</text>
  <text x="695" y="456" class="body">使用与用户问题相同的语言，Markdown 组织答案</text>
  <text x="695" y="484" class="body">不得添加无证据事实，证据不足时说明</text>
  <rect x="705" y="502" width="270" height="58" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="725" y="529" class="mono">References:</text>
  <text x="745" y="553" class="mono">[reference_id, ...]</text>

  <rect x="235" y="645" width="810" height="105" class="box addon"/>
  <text x="265" y="684" class="head">本系统追加指导语位置</text>
  <text x="265" y="718" class="body">模板末尾追加：课程资料优先、结论先行、分步解释、保留术语、学生/教师角色化要求、证据不足说明。</text>

  <path d="M360 223 H385" class="arrow"/><path d="M690 223 H715" class="arrow"/>
  <path d="M540 300 V360 H440 V375" class="arrow"/><path d="M870 300 V360 H840 V375" class="arrow"/>
  <path d="M640 570 V640" class="arrow"/>
</svg>
