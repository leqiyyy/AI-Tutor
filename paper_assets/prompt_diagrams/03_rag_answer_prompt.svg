<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#536179}
      .box{fill:#fff;stroke:#ccd5e4;stroke-width:2;rx:8}.blue{fill:#edf5ff;stroke:#74a7df}.green{fill:#eef9f1;stroke:#73b77d}.orange{fill:#fff6e8;stroke:#d8a13f}.gray{fill:#f3f4f6;stroke:#9aa5b1}
      .head{font-size:19px;font-weight:700}.body{font-size:15px;fill:#334155}.small{font-size:13px;fill:#64748b}
      .arrow{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1280" height="760" fill="#f8fafc"/>
  <text x="60" y="64" class="title">最终回答生成 Prompt</text>
  <text x="60" y="96" class="subtitle">回答生成由 LightRAG 模板组织检索证据，本系统追加课程助教回答约束，并按学生或教师角色补充要求。</text>

  <rect x="70" y="145" width="310" height="190" class="box blue"/>
  <text x="95" y="185" class="head">LightRAG 回答模板</text>
  <text x="95" y="221" class="body">rag_response / naive_rag_response</text>
  <text x="95" y="249" class="body">Role：基于知识库上下文回答</text>
  <text x="95" y="277" class="body">Context：KG Data + Document Chunks</text>
  <text x="95" y="305" class="body">要求：引用 reference_id、同语言回答</text>

  <rect x="485" y="145" width="310" height="190" class="box green"/>
  <text x="510" y="185" class="head">本系统追加内容</text>
  <text x="510" y="221" class="body">AI Tutor education response guidance</text>
  <text x="510" y="249" class="body">课程资料优先，证据不足说明</text>
  <text x="510" y="277" class="body">学生：分步讲解与易错点</text>
  <text x="510" y="305" class="body">教师：课堂讲解与练习建议</text>

  <rect x="900" y="145" width="310" height="190" class="box orange"/>
  <text x="925" y="185" class="head">运行时填充</text>
  <text x="925" y="221" class="body">用户问题与对话历史</text>
  <text x="925" y="249" class="body">实体、关系、文本块</text>
  <text x="925" y="277" class="body">引用文档列表</text>
  <text x="925" y="305" class="body">可选 user_prompt 角色指导语</text>

  <path d="M380 240 H480" class="arrow"/><path d="M795 240 H895" class="arrow"/>
  <path d="M640 335 V420" class="arrow"/><path d="M1055 335 V420" class="arrow"/>

  <rect x="250" y="440" width="780" height="165" class="box gray"/>
  <text x="285" y="480" class="head">模型输出</text>
  <text x="285" y="516" class="body">简体中文回答：结论、解释、步骤或教学建议</text>
  <text x="285" y="546" class="body">References：与检索证据对应的 reference_id</text>
  <text x="285" y="576" class="body">系统保存：AI 消息、引用记录、查询追踪、耗时与质量字段</text>
  <text x="285" y="606" class="small">当回答出现乱码或重复时，后续进入答案修复 prompt。</text>
</svg>
