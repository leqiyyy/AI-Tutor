<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#5f6f89}
      .node text{font-size:15px;font-weight:700}.desc{font-size:13px;fill:#64748b}
      .edge{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .label{font-size:13px;fill:#334155}
      .concept{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}
      .formula{fill:#fef3c7;stroke:#d97706;stroke-width:2}
      .example{fill:#dcfce7;stroke:#16a34a;stroke-width:2}
      .mis{fill:#fee2e2;stroke:#dc2626;stroke-width:2}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:8}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1280" height="760" fill="#f8fafc"/>
  <text x="60" y="64" class="title">文本知识图谱示例</text>
  <text x="60" y="94" class="sub">来源：正文段落、Markdown 文本、OCR 文本或文档中的普通文本 chunk。实体关系由 LightRAG 图谱抽取模板生成，本系统追加课程实体约束。</text>

  <path d="M265 260 C360 190 465 190 560 260" class="edge"/>
  <text x="382" y="198" class="label">prerequisite_of</text>
  <path d="M560 285 C665 250 735 250 835 285" class="edge"/>
  <text x="658" y="246" class="label">part_of</text>
  <path d="M560 335 C650 440 735 455 835 410" class="edge"/>
  <text x="646" y="438" class="label">explains</text>
  <path d="M560 305 C610 380 640 495 585 575" class="edge"/>
  <text x="610" y="450" class="label">uses_formula</text>
  <path d="M835 395 C760 520 680 600 585 600" class="edge"/>
  <text x="704" y="587" class="label">example_of</text>
  <path d="M835 330 C930 280 1030 280 1110 330" class="edge"/>
  <text x="943" y="277" class="label">contrasts_with</text>

  <g class="node">
    <circle cx="210" cy="285" r="58" class="concept"/>
    <text x="184" y="281">先修知识</text><text x="174" y="306">网络分层</text>
  </g>
  <g class="node">
    <circle cx="560" cy="300" r="66" class="concept"/>
    <text x="524" y="296">核心概念</text><text x="523" y="322">拥塞控制</text>
  </g>
  <g class="node">
    <circle cx="885" cy="320" r="62" class="concept"/>
    <text x="849" y="316">组成机制</text><text x="858" y="342">慢启动</text>
  </g>
  <g class="node">
    <circle cx="1120" cy="360" r="58" class="mis"/>
    <text x="1092" y="356">易错点</text><text x="1080" y="381">流量控制</text>
  </g>
  <g class="node">
    <circle cx="525" cy="610" r="60" class="formula"/>
    <text x="498" y="606">公式</text><text x="472" y="632">窗口增长规则</text>
  </g>
  <g class="node">
    <circle cx="890" cy="455" r="58" class="example"/>
    <text x="862" y="451">例题</text><text x="843" y="476">吞吐量计算</text>
  </g>

  <rect x="75" y="620" width="360" height="85" class="box"/>
  <text x="100" y="655" class="label">图例：蓝色=课程概念，黄色=公式，绿色=例题，红色=易错点</text>
  <text x="100" y="682" class="desc">该图展示文本 chunk 中概念、公式和例题之间的语义关系。</text>
</svg>
