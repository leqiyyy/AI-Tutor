services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: live
        VITE_API_BASE_URL: /api/v1
        VITE_BASE_PATH: /
    image: ai-tutor-frontend:server
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend-api:
        condition: service_healthy

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-tutor-backend:server
    restart: unless-stopped
    env_file:
      - ./backend/.env.server
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads
      - backend_rag_storage:/app/rag_storage
      - backend_rag_output:/app/rag_output
      - backend_runtime_tmp:/app/runtime_tmp
      - modelscope_cache:/root/.cache/modelscope
      - huggingface_cache:/root/.cache/huggingface
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/ready || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  backend-migrate:
    image: ai-tutor-backend:server
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.server
    environment:
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
    command: python scripts/init_database.py
    restart: "no"

  celery-worker:
    image: ai-tutor-backend:server
    restart: unless-stopped
    env_file:
      - ./backend/.env.server
    environment:
      TZ: Asia/Shanghai
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads
      - backend_rag_storage:/app/rag_storage
      - backend_rag_output:/app/rag_output
      - backend_runtime_tmp:/app/runtime_tmp
      - modelscope_cache:/root/.cache/modelscope
      - huggingface_cache:/root/.cache/huggingface
    command: celery -A app.core.celery_app:celery_app worker --loglevel=info --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=1

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
      POSTGRES_DB: ${POSTGRES_DB:-ai_tutor}
      POSTGRES_USER: ${POSTGRES_USER:-ai_tutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_tutor}
    command: ["postgres", "-c", "timezone=Asia/Shanghai"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_tutor} -d ${POSTGRES_DB:-ai_tutor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.26
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${GRAPH_DB_PASSWORD:-change_me}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

volumes:
  backend_uploads:
  backend_rag_storage:
  backend_rag_output:
  backend_runtime_tmp:
  modelscope_cache:
  huggingface_cache:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  minio_data:
